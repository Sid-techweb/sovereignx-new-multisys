version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: sovereignx-pgvector
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sovereignx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
    name: sovereignx_pgdata
